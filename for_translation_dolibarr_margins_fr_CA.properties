AgentContactTypeDetails=Définissez quel type de contact (lié aux factures) sera utilisé pour le rapport de marge par contact/adresse. Notez que la lecture des statistiques sur un contact n'est pas fiable car dans la plupart des cas, le contact peut ne pas être défini explicitement sur les factures.
