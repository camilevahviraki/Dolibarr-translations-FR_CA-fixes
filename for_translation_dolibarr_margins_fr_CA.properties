MarginTypeDesc=* Marge sur le meilleur prix d'achat = Prix de vente - Meilleur prix fournisseur défini sur la fiche produit<br>* Marge sur le coût moyen pondéré (CMP) = Prix de vente - Prix moyen pondéré du produit (PMP) ou meilleur prix fournisseur si le PMP n'est pas encore défini<br>* Marge sur le prix de revient = Prix de vente - Prix de revient défini sur la fiche produit ou CMP si le prix de revient n'est pas défini, ou meilleur prix fournisseur si le CMP n'est pas encore défini
