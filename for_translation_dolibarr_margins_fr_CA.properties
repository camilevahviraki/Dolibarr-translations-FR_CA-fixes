CheckMargins=Détail des marges
MarginPerSaleRepresentativeWarning=Le rapport de marge par utilisateur utilise le lien entre les tiers et les représentants commerciaux pour calculer la marge de chaque représentant. Étant donné que certains tiers peuvent n'avoir aucun représentant commercial dédié et que d'autres peuvent être liés à plusieurs, certains montants peuvent ne pas figurer dans ce rapport (en l'absence de représentant commercial) et certains peuvent apparaître sur des lignes différentes (pour chaque représentant commercial).
MarginUpdateLinkedBuyingPrice=Il est proposé de propager la modification du prix de revient sur une ligne à toutes les lignes des propositions, commandes et factures liées qui concernent le même produit (les utilisateurs devront choisir d'accepter ou de refuser chaque modification).
UpdateLinkedBuyingPrice=Mettez à jour le prix de revient sur toutes les lignes (concernant le même produit) des documents liés.
UpdateLinkedBuyingPriceQuestion=Le prix de revient de cette ligne a changé. Faut-il l'appliquer aux lignes des documents liés qui concernent le même produit ?
