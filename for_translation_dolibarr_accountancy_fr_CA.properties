ACCOUNTING_DISABLE_BINDING_ON_SALES=Désactiver la liaison & le transfert en comptabilité sur les ventes (les factures clients ne seront pas prises en compte en comptabilité)
ACCOUNTING_DISABLE_BINDING_ON_PURCHASES=Désactiver la liaison & le transfert en comptabilité sur les achats (les factures fournisseurs ne seront pas prises en compte en comptabilité)
ACCOUNTING_DISABLE_BINDING_ON_EXPENSEREPORTS=Désactiver la liaison & le transfert en comptabilité sur les notes de frais (les notes de frais ne seront pas prises en compte en comptabilité)
ACCOUNTING_DISABLE_TRANSFER_ON_ASSETS=Désactivation du transfert comptable des immobilisations (les actifs ne seront pas pris en compte en comptabilité).
ACCOUNTING_DISABLE_TRANSFER_ON_DISCOUNTS=Désactiver le transfert comptable des remises (les remises ne seront pas prises en compte dans la comptabilité).
ACCOUNTING_ENABLE_LETTERING=Activez la fonction de rapprochement dans la comptabilité.
ACCOUNTING_ENABLE_LETTERING_DESC=Lorsque cette option est activée, vous pouvez définir, pour chaque écriture comptable, un code permettant de regrouper différents mouvements comptables. Auparavant, lorsque les journaux étaient gérés indépendamment, cette fonctionnalité était nécessaire pour regrouper les lignes de mouvement de différents journaux. Cependant, avec la comptabilité Dolibarr, ce code de suivi, appelé « <b> », « %s » et « </b> », est enregistré automatiquement. Un rapprochement automatique est donc effectué, sans risque d'erreur, ce qui rend cette fonctionnalité inutile pour une utilisation courante. Une fonction de saisie manuelle est proposée aux utilisateurs qui préfèrent ne pas faire confiance au système informatique pour le transfert des données comptables.
EnablingThisFeatureIsNotNecessary=L'activation de cette fonctionnalité n'est plus nécessaire pour une gestion comptable rigoureuse.
ACCOUNTING_ENABLE_AUTOLETTERING=Activez la correspondance automatique lors du transfert vers la comptabilité.
ACCOUNTING_ENABLE_AUTOLETTERING_DESC=Le code de correspondance est généré et incrémenté automatiquement, et n'est pas choisi par l'utilisateur final.
ACCOUNTING_LETTERING_NBLETTERS=Nombre de lettres lors de la génération du code de correspondance (par défaut 3)
ACCOUNTING_LETTERING_NBLETTERS_DESC=Certains logiciels de comptabilité n'acceptent qu'un code à deux lettres. Ce paramètre permet de régler cet aspect. Le nombre de lettres par défaut est de trois.
OptionsAdvanced=Options avancées
ACCOUNTING_FORCE_ENABLE_VAT_REVERSE_CHARGE=Activer la gestion de l'autoliquidation de la TVA sur les achats fournisseurs
ACCOUNTING_FORCE_ENABLE_VAT_REVERSE_CHARGE_DESC=Lorsque cette option est activée, vous pouvez définir un traitement comptable particulier pour un fournisseur ou une facture fournisseur donnée. Une ligne de débit et une ligne de crédit supplémentaires seront générées en comptabilité dans 2 comptes du plan comptable définis dans la page de configuration « %s ».
ACCOUNTING_ENABLE_TABONTHIRDPARTY=Activer un onglet sur les cartes de tiers pour visualiser le grand livre auxiliaire
ACCOUNTING_ENABLE_TABONTHIRDPARTY_DESC=Lorsque cette option est activée, un nouvel onglet s'affiche dans les cartes de tiers pour afficher et gérer la comptabilité du tiers afin de rapprocher, d'imprimer, etc.
AccountingDissociateCashSales=Distinguer les ventes au comptant des ventes traditionnelles
AccountingDissociateCashSalesDesc=Lorsque cette option est activée, un nouveau type de journal apparaît (Ventes au comptant) qui vous permet d'enregistrer les ventes en caisse dans un journal distinct.
AccountingDefaultNotExportLettering=Par défaut, n'exportez pas le lettrage lors de la génération du fichier.
AccountingDefaultNotExportLetteringDesc=Si cette option est activée, les informations de lettrage des écritures comptables ne seront pas incluses dans le fichier d'exportation généré.
AccountingDefaultNotNotifiedExportDate=Par défaut, les lignes non encore exportées sont marquées comme « Exportées ».
AccountingDefaultNotNotifiedExportDateDesc=Si cette option est activée, chaque ligne exportée sera horodatée. Pour modifier une ligne marquée comme exportée, vous devrez supprimer l'écriture comptable correspondante et la transférer de nouveau en comptabilité.
AccountingDefaultNotifiedValidationDate=Par défaut, valider et verrouiller les écritures comptables exportées
AccountingDefaultNotifiedValidationDateDesc=Si cette option est activée, les écritures comptables exportées seront automatiquement validées et verrouillées (même effet que la fonction « Fermer »). Il sera alors impossible de modifier ou de supprimer ces lignes.
AccountingDefaultNotifiedExportFull=Par défaut, exporter les documents sources (Disponible uniquement sur certains modèles d'exportation Quadra | FEC | FEC2)
AccountingDefaultNotifiedExportFullDesc=Si cette option est activée, les documents sources associés aux écritures comptables (factures, notes de crédit, etc.) seront inclus ou joints lors de la génération du fichier d'exportation.
