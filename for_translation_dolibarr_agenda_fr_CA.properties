AgendaUrlOptions1=Vous pouvez aussi ajouter les paramètres suivants pour filtrer les réponses :
AgendaUrlOptions3=<b>logina=%s</b> pour restreindre la sortie aux actions appartenant à un utilisateur <b>%s</b> (utilisez <b>logina=!%s</b> pour les événements qui n'appartiennent pas à l'utilisateur).
AgendaUrlOptions4=<b>logint=%s</b> pour restreindre la sortie aux actions attribuées à l'utilisateur <b>%s</b> (propriétaire et autres).
AgendaUrlOptionsProject=<b>project=__PROJECT_ID__</b> pour restreindre la sortie aux actions liées au projet <b>__PROJECT_ID__</b>.
AgendaUrlOptionsType=<b>actiontype=%s</b> pour obtenir des événements automatiques ou manuels
AgendaUrlOptionsCode=<b>actioncode=%s</b> pour obtenir uniquement les événements avec un code donné
AgendaUrlOptionsIncludeHolidays=<b>includeholidays=1</b> pour inclure les événements de vacances.
AgendaUrlOptionsLimitDays=<b>notolderthan=%s</b> pour limiter aux événements des %s derniers jours (la valeur par défaut est %s).
AgendaUrlOptionsLimit=<b>limit=50</b> pour limiter aux 50 derniers événements (la valeur par défaut et le maximum sont %s).
