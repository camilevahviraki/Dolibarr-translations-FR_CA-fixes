InventorySheetPdfModelDesc=Fiche d'inventaire : quantité attendue, quantité comptée et écart par ligne. Tant que l'inventaire n'est pas enregistré, les colonnes « compté » et « écart » restent vides afin que le document puisse servir de fiche de comptage physique.
InventoryRefTypedManually=Saisie manuellement
VirtualStockHorizon=Horizon pour l'approvisionnement entrant
VirtualStockHorizonHelp=Le nombre de jours à venir inclut les arrivages dans le stock virtuel. L'horizon est une période : seules les commandes fournisseurs dont la livraison est prévue et les ordres de fabrication dont la fin est prévue entre aujourd'hui et aujourd'hui + N jours sont comptabilisés. Les éléments prévus à plus long terme ne sont pas encore comptabilisés, de même que les éléments prévus avant aujourd'hui qui n'ont pas été exécutés, car ils se sont avérés erronés. Laissez ce champ vide pour désactiver l'horizon et comptabiliser tous les éléments, quelle que soit leur date prévue (valeur par défaut). Une valeur de 0 correspond à un horizon valide : seuls les éléments prévus pour aujourd'hui sont comptabilisés.
VirtualStockHorizonKeepUndatedOrders=Compter les commandes des fournisseurs sans date de livraison prévue
VirtualStockHorizonKeepUndatedOrdersHelp=Lorsqu'un horizon temporel est défini, les commandes fournisseurs sans date de livraison prévue ne sont pas comptabilisées, car leur arrivée est inconnue. Activez cette option pour les comptabiliser malgré tout.
ReplenishQuantityZeroExplanation=La quantité à commander est nulle car une quantité suffisante a déjà été commandée.
ErrorStockMovementAlreadyReversed=Le mouvement du titre %s a déjà été inversé
ErrorStockMovementIsAlreadyAReverse=Le mouvement du stock %s est lui-même un mouvement inverse et ne peut pas être inversé.
ErrorStockMovementBadType=Le mouvement de stock %s est d'un type irréversible
