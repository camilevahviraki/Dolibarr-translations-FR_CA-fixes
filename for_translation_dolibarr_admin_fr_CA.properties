AllowPasswordResetBySendingANewPassByEmail=Si un utilisateur A a cette autorisation, et même si l'utilisateur A n'est pas un utilisateur "admin", A est autorisé à réinitialiser le mot de passe de tout autre utilisateur B, le nouveau mot de passe sera envoyé au courriel de l'autre utilisateur B mais il ne sera pas visible par A. Si l'utilisateur A a le drapeau "admin", il pourra également savoir quel est le nouveau mot de passe généré de B afin qu'il puisse prendre le contrôle du compte utilisateur B.
AllowAnyPrivileges=Si un utilisateur A dispose de cette autorisation, il peut créer un utilisateur B avec tous les privilèges, puis utiliser cet utilisateur B, ou s'octroyer l'accès à n'importe quel autre groupe avec les autorisations de son choix. Ainsi, accorder cette autorisation à un utilisateur A signifie que ce dernier possède tous les privilèges métier (seul l'accès au système, notamment aux pages de configuration, lui sera interdit).
