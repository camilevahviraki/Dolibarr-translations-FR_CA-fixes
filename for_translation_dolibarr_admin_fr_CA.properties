EmailCollectorConfirmCollectTitle=Confirmation de collecte par e-mail
EmailCollectorConfirmCollect=Voulez-vous exécuter ce collecteur maintenant ?
EmailCollectorExampleToCollectTicketRequestsDesc=Collectez les e-mails qui correspondent à certaines règles et créez automatiquement un ticket (le ticket de module doit être activé) avec les informations de l'e-mail. Vous pouvez utiliser ce collecteur si vous fournissez une assistance par e-mail, afin que votre demande de ticket soit automatiquement générée. Activez également Collect_Responses pour collecter les réponses de votre client directement sur la vue ticket (vous devez répondre depuis Dolibarr).
EmailCollectorExampleToCollectTicketRequests=Exemple de collecte de la demande de ticket (premier message uniquement)
EmailCollectorExampleToCollectAnswersFromExternalEmailSoftwareDesc=Analysez le dossier « Éléments envoyés » de votre boîte mail pour trouver les e-mails envoyés en réponse à un autre e-mail directement depuis votre logiciel de messagerie et non depuis Dolibarr. Si un tel e-mail est trouvé, l'événement de réponse est enregistré dans Dolibarr.
EmailCollectorExampleToCollectAnswersFromExternalEmailSoftware=Exemple de collecte de réponses par e-mail envoyées à partir d'un logiciel de messagerie externe
EmailCollectorExampleToCollectDolibarrAnswersDesc=Collectez tous les e-mails de réponse à un e-mail envoyé depuis votre application. Un événement (le module Agenda doit être activé) avec la réponse sera enregistré à l'emplacement approprié. Par exemple, si vous envoyez par e-mail une proposition commerciale, une commande, une facture ou un message pour un ticket depuis l'application et que le destinataire répond à votre e-mail, le système récupérera automatiquement la réponse et l'ajoutera à votre ERP.
EmailCollectorExampleToCollectDolibarrAnswers=Exemple collectant tous les messages entrants étant des réponses aux messages envoyés depuis Dolibarr'
EmailCollectorExampleToCollectLeadsDesc=Collecte les courriels qui correspondent à certaines règles et crée automatiquement une opportunité (le module Projet doit être activé) avec les informations du courriel. Vous pouvez utiliser ce collecteur si vous souhaitez suivre votre opportunité en utilisant le module Projet (1 opportunité = 1 projet), ainsi vos opportunités seront générées automatiquement. Si le collecteur Collect_Responses est également activé, lorsque vous envoyez un courriel à partir de vos opportunités, propositions ou tout autre objet, vous pouvez également voir les réponses de vos clients ou partenaires directement sur l'application.<br>Note : Dans ce premier exemple, le titre de l'opportunité est généré avec le courriel. Si le tiers n'est pas trouvé dans la base de données (nouveau client), l'opportunité sera attachée au tiers avec l'ID 1.
EmailCollectorExampleToCollectLeads=Exemple de collecte de leads
EmailCollectorExampleToCollectJobCandidaturesDesc=Collectez les e-mails de candidature aux offres d'emploi (le module Recrutement doit être activé). Vous pouvez compléter ce collecteur si vous souhaitez créer automatiquement une candidature à une demande d'emploi. Remarque : Avec cet exemple initial, le titre de la candidature est généré incluant le courriel.
