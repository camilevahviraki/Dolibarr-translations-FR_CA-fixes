AI_USED_FOR_FILE_TO_TEXT_CONVERTIONHelp=Le fichier à analyser (PDF ou image) est envoyé au service d'IA sous forme de contenu binaire, en deux étapes : une première conversion du fichier en texte (la reconnaissance optique de caractères est effectuée par le service d'IA, avec le modèle défini pour l'analyse du document, par exemple AI_API_MISTRAL_MODEL_DOCPARSING), puis une seconde analyse du texte extrait pour renvoyer les données structurées. Tout autre type de fichier, ou service ne prenant pas en charge les fichiers bruts, génère une erreur.
