EmailCollectorIsNotAnswerUseReferences=Traiter l'en-tête Références générique comme une réponse pour le filtre isnotanswer
EmailCollectorIsNotAnswerUseReferencesHelp=Lorsqu'elle est activée, toute référence d'en-tête non vide est considérée comme une réponse lors de l'évaluation du filtre isnotanswer (comportement hérité). Laissez cette option désactivée pour éviter les faux positifs des notifications automatisées de la plateforme.
EmailCollectorAllowedAttachmentExtensions=Extensions de pièces jointes autorisées
EmailCollectorAllowedAttachmentExtensionsHelp=Liste des extensions de pièces jointes autorisées (séparées par des virgules et des points-virgules) : pdf, doc, docx, txt, pages. Laissez ce champ vide pour conserver toutes les pièces jointes. Si cette option est renseignée, les pièces jointes sans extension seront ignorées.
