InvoicePaymentReferenceModeHelp=Une référence de paiement structurée permet à la banque d'associer automatiquement un paiement entrant à la facture correspondante. Le format varie selon le pays de votre entreprise : communication structurée belge pour la Belgique, référence nationale ou RF pour la Finlande, référence DIAS pour la Grèce et référence créancier ISO 11649 ailleurs. Cette référence est enregistrée sur la facture lors de sa validation.
