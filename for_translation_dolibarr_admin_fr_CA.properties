SubcontractorsDesc=Si la gestion de votre application est sous-traitée à des prestataires de services externes (un comptable et/ou un prestataire de services informatiques), vous pouvez saisir ici leurs informations afin qu'elles ne soient pas perdues en cas de remplacement de l'administrateur.
