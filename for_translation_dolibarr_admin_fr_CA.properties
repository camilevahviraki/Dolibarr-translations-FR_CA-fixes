GenericMaskCodes=Vous pouvez saisir n'importe quel masque de numérotation. Dans ce masque, les balises suivantes peuvent être utilisées : <br><b>{000000}</b> correspond à un numéro qui sera incrémenté à chaque %s. Saisissez autant de zéros que la longueur souhaitée du compteur. Le compteur sera complété par des zéros à partir de la gauche afin d'avoir autant de zéros que le masque. <br><b>{000000+000}</b> identique au précédent mais un décalage correspondant au nombre à droite du signe + est appliqué à partir du premier %s. <br><b>{000000@x}</b> Identique à la précédente, mais le compteur est remis à zéro lorsque le mois x est atteint (x entre 1 et 12, ou 0 pour utiliser les premiers mois de l'exercice définis dans votre configuration, ou 99 pour une remise à zéro mensuelle). Si cette option est utilisée et que x est égal ou supérieur à 2, la séquence {yy}{mm} ou {yyyy}{mm} est également requise.<br>
GenericMaskCodes1=<b>{yy}</b>, <b>{yyyy}</b> ou <b>{y}</b> année sur 2, 4 ou 1 nombre. <br><b>{mm}</b> mois (01 à 12).<br><b>{dd}</b> jour (01 à 31).<br>
GenericMaskCodes2=<b>{cccc}</b> le code client sur n caractères<br><b>{cccc000}</b> le code client sur n caractères est suivi d'un compteur dédié au client. Ce compteur dédié au client est réinitialisé en même temps que le compteur global.<br><b>{tttt} </b> Le code du tiers type sur n caractères (voir menu Accueil - Paramétrage - Dictionnaire - Types de tiers). Si vous ajoutez cette balise, le compteur sera différent pour chaque type de tiers.<br>
GenericMaskCodes2b=<b>{uuuu}</b> les n premiers caractères du nom de famille de l'utilisateur qui crée l'objet (n est le nombre de "u").
GenericMaskCodes3=Tout autre caractère dans le masque sera laissé inchangé.<br>Les espaces ne sont pas permis.<br>
GenericMaskCodes3EAN=Tous les autres caractères du masque resteront intacts (sauf * ou ? en 13ème position dans EAN13).<br>Les espaces ne sont pas autorisés.<br>Dans EAN13, le dernier caractère après le dernier } en 13ème position doit être * ou ? . Il sera remplacée par la clé calculée.<br>
GenericMaskCodes4a=<u>Exemple sur le 99e %s du tiers TheCompany, avec la date 2023-01-31 :</u><br>
GenericMaskCodes4b=<u>Exemple sur un tiers créé le 31/01/2023 :</u><br>
GenericMaskCodes4c=<u>Exemple sur un produit créé le 31/01/2023 :</u><br>
GenericMaskCodes5=<b>ABC{yy}{mm}-{000000}</b> donnera <b>ABC2301-000099</b><br><b>{0000+100@1}-ZZZ/{dd}/XXX</b> donnera <b>0199-ZZZ/31/XXX</b>
GenericMaskCodes5b=<b>IN{yy}{mm}-{0000}-{t}</b> donnera <b>IN2301-0099-A</b> si le type de l'entreprise est « Responsable Inscripto » avec le code pour le type qui est « A_RI »
