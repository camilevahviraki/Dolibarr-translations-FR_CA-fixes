BackupDesc2=Sauvegardez le contenu du répertoire « documents » (<b>, %s, </b>) contenant tous les fichiers téléchargés et générés. Cette sauvegarde n'inclut pas les fichiers de vidage générés à l'étape 1. Cette opération peut prendre plusieurs minutes.
