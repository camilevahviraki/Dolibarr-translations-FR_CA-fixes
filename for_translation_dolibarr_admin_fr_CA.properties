PaymentRefBase=Référence construite à partir de
PaymentRefBaseHelp=Champ utilisé pour créer la référence de chaque tiers. Il peut être modifié pour chaque tiers sur sa fiche.
# PaymentRefFIFormat=Format of the Finnish reference
# PaymentRefFIFormatHelp=The national reference (viitenumero) is read by every Finnish bank. The RF form carries the same number inside the international ISO 11649 format, which is also accepted for payments from abroad. References already issued are not changed.
# PaymentRefFIFormatRF=RF creditor reference (ISO 11649)
# PaymentRefFIFormatNational=Finnish national reference
# PaymentRefCompanyPaymentId=Company payment reference
# PaymentRefCompanyPaymentIdHelp=Used only when Home - Setup - Invoices is set to one reference for the whole company. Every invoice then carries the same reference.<br><br>Enter the complete reference your customers already pay with, for example RF18539007547034, and it is printed as it is. Or enter a number, and Dolibarr builds the reference from it in the format of your country.
DIASCode=Code marchand DIAS
# DIASCodeHelp=Five digit code given by your Greek bank when you join DIAS. It cannot be chosen freely.<br><br>Dolibarr needs it only to build new references. A complete reference you enter yourself, in the company payment reference or on a third party, is used as it is.<br><br>To find it in a reference you already use, take the five digits after RF and the two check digits: RF20 92192 ... gives 92192. Otherwise ask your bank.
DIASCodeExample=Par exemple 92192
ErrorDIASCodeMustBe5Digits=Le code marchand DIAS doit comporter cinq chiffres et commencer par 9.
DIASCodeUsage=Utilisation du code DIAS
DIASCodeUsageHelp=Le 10e chiffre de la référence DIAS, après RF, les deux chiffres de contrôle et votre code DIAS, indique à la banque payeuse comment vérifier le paiement. Ce code doit correspondre à la configuration enregistrée par votre banque auprès de DIAS. En cas de doute, veuillez contacter votre banque.
DIASCodeUsage8=8 - Même code pour le virement bancaire et le prélèvement automatique
DIASCodeUsage9=9 - Codes distincts pour le virement bancaire et le prélèvement automatique
ErrorDIASReferenceAmountChecked=Cette référence DIAS comporte un chiffre de 0 à 7 à la position 10. La banque la vérifie donc pour un montant fixe et rejettera tout autre montant. Elle ne peut pas être utilisée pour plusieurs factures. Veuillez demander à votre banque une référence avec un chiffre 8 ou 9 à la position 10.
WarningPaymentRefDIASCodeMissing=Aucune référence de paiement ne peut être générée tant que le code marchand DIAS n'est pas défini dans Accueil > Configuration > Société. Les factures validées avant cette opération ne comporteront aucune référence.
WarningPaymentRefDIASCodeMissingThirdparty=Les références déjà enregistrées chez un tiers continueront d'être utilisées. Un tiers qui n'en possède aucune ne sera référencé qu'une fois le code marchand DIAS défini dans Accueil > Configuration > Société.
