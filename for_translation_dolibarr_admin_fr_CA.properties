ModuleCompanyCodeSupplierDigitaria=%s suivi du nom du fournisseur tronqué du nombre de caractères : %s pour le code comptable du fournisseur.
# WarningDigitariaCodeLengthNotMatchingAccountLength=The generated accounting code length (prefix + number of characters) should equal the auxiliary account length (%s), otherwise the general ledger pads the code with trailing zeros.
ModuleCompanyCodeMinga=Renvoie un code comptable numérique tiré d'une plage de nombres, comme les comptes débiteurs et créanciers des plans comptables allemands SKR03/SKR04 utilisés avec DATEV.
