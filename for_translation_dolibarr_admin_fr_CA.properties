MAIN_MAX_DECIMALS_CURRENCY_RATE=Nombre maximal de décimales pour le taux de change
MAIN_MAX_DECIMALS_CURRENCY_RATE_Help=Nombre de décimales utilisées pour le stockage et l'affichage des taux de change. Les taux de change sont des ratios, et non des prix ; ils nécessitent donc 6 à 8 décimales pour les devises faibles (MXN, JPY, KRW, etc.). La valeur par défaut est 8.
