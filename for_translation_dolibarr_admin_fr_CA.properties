# INVOICE_ADD_FI_BARCODEMore=Prints the domestic barcode read by Finnish banks from a credit transfer form, and adds the same digits as text so the payer can copy them into an online bank. It needs a payment reference, a bank account with an IBAN and a due date on the invoice.
