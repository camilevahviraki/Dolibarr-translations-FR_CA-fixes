WarningUpgrade=Avertissement :\nAvez-vous d'abord effectué une sauvegarde de la base de données ?\nCette opération est fortement recommandée. Une perte de données (due par exemple à des bugs dans la version 5.5.40/41/42/43 de MySQL) peut être possible au cours de ce processus. Il est donc essentiel de faire un vidage complet de votre base de données avant de commencer toute migration.\n\nCliquez sur OK pour démarrer le processus de migration...
ErrorDatabaseVersionForbiddenForMigration=La version de votre base de données est %s. Elle contient un bug critique, qui rend possible la perte de données si vous apportez des modifications structurelles à votre base de données, comme cela est requis par le processus de migration. Pour cette raison, la migration ne sera pas autorisée tant que vous n'aurez pas mis à niveau votre base de données vers une version de couche (corrigée) (liste des versions boguées connues : %s)
