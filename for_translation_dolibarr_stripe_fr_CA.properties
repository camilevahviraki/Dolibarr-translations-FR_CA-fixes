YouCanAddTagOnUrl=Vous pouvez également ajouter le paramètre d'URL <b>&tag=value</b> à l'une de ces URL (obligatoire uniquement pour les paiements non liés à un objet) pour ajouter votre propre balise de commentaire de paiement.<br>Pour l'URL des paiements sans objet existant, vous pouvez également ajouter le paramètre <strong>&noidempotency=1</strong> afin que le même lien avec la même balise puisse être utilisé plusieurs fois (certains modes de paiement peuvent limiter le paiement à 1 pour chaque lien différent sans ce paramètre)
YouCanEmbedOnWebsite=Si vous souhaitez intégrer la page de paiement à un site web Dolibarr, vous pouvez inclure le paramètre : <b>&ws=website_ref</b>.<br>. De plus, deux pages nommées <b>paymentok</b> et <b>paymentko</b> doit être créé sur le site Web pour recevoir la redirection après un paiement en ligne réussi ou échoué.
