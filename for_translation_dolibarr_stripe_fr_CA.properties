PaymentRecordedButPostPocessingKo=Votre paiement a bien été enregistré par le système. Cependant, il semble que le traitement post-paiement n'ait pas pu être finalisé. Nous en avons été informés et nous nous efforçons de résoudre ce problème au plus vite. Nous vous recommandons de ne pas effectuer un second paiement et de nous envoyer une capture d'écran de cette page par e-mail afin que nous puissions prendre en compte le problème.
