TicketSendToInternalCCHelp=Saisissez l'e-mail que vous souhaitez utiliser automatiquement comme destinataire de copie carbone lors de l'envoi d'un e-mail à partir de la page du ticket.
SendReminderForStaleTicketsTitle=Envoyer un rappel par courriel pour les billets en retard dès la première ou la prochaine réponse
SendReminderForStaleTickets=Un e-mail est envoyé à l'utilisateur assigné lorsqu'un ticket non clôturé dépasse le délai TICKET_DELAY_BEFORE_FIRST_RESPONSE ou TICKET_DELAY_SINCE_LAST_RESPONSE (les mêmes délais qui affichent l'avertissement « En retard » dans la liste des tickets), sans réponse. Le modèle d'e-mail à envoyer est défini par la constante TICKET_EMAIL_TEMPLATE_REMIND_STALE. Cet envoi est répété une fois par jour tant que le ticket reste en retard.
SendingReminderForStaleTicket=Envoi d'un rappel pour un billet en retard
TicketStaleReminderTopic=Le billet qui vous a été attribué est en retard.
TicketStaleReminderContent=Le ticket suivant est resté trop longtemps sans réponse et est désormais considéré comme en retard.
