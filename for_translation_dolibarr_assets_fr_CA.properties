ASSET_DEPRECIATION_DURATION_PER_YEAR=Période proportionnelle en jours pour le calcul de l'amortissement sur un an
ASSET_DEPRECIATION_DAY_COUNT_CONVENTION=Convention de calcul des jours du prorata temporis
ASSET_DEPRECIATION_DAY_COUNT_CONVENTIONTooltip=Comment l'amortissement d'une période <b>partielle</b> est calculé, c'est-à-dire la première et la dernière année d'un actif. Une annuité complète correspond toujours à la valeur divisée par la durée et n'est jamais affectée par ce paramètre.<br><br>Une convention définit <b>à la fois</b> comment les jours de la période sont comptés <b>et</b> par combien de jours une année complète est divisée. Les deux doivent toujours correspondre : compter les jours civils réels et les diviser par 360 surestime chaque période partielle d'environ 1,39 pour cent.<br><br><b>30/360</b> : chaque mois compte 30 jours et chaque année 360 jours. Convention appliquée par la plupart des cabinets comptables en France.<br><b>Jours réels / 365</b> : jours civils réels de la période, divisés par 365.<br><b>Jours réels / année réelle</b> : jours civils réels, chaque année étant divisée par sa propre durée réelle, 365 ou 366. La plus précise sur une période qui comprend un 29 février.<br><br>Exemple sur un actif de 13000 amorti sur 5 ans, mis en service le 10 mars et vendu le 23 février de la quatrième année, avec des exercices d'août à juillet. Amortissement cumulé à la cession : 7684.44 avec 30/360, 7700.27 avec jours réels / 365, 7697.29 avec jours réels / année réelle.<br><br><b>Attention</b> : la modification de ce paramètre ne recalcule pas les plans déjà générés. Enregistrez à nouveau les options d'amortissement d'un actif pour régénérer son plan.
AssetDayCountConventionThirty360=30/360 - chaque mois compte 30 jours, chaque année 360 jours (usage en France)
AssetDayCountConventionAct365=Jours réels / 365 - nombre de jours calendaires réels divisé par 365
AssetDayCountConventionActAct=Jours réels / année réelle - jours réels du calendrier, chaque année divisée par sa propre durée (365 ou 366)
