ExpenseReportVatRateHelp=Saisissez le taux de TVA applicable à votre comptabilité, c'est-à-dire la TVA déductible dans votre déclaration de TVA. La TVA facturée par un autre pays (par exemple, sur du carburant ou un hôtel à l'étranger) n'est pas déductible : enregistrez ce type de facture avec un taux de TVA de 0. Si vous récupérez cette TVA étrangère auprès du pays concerné (dans l'UE, via la procédure de remboursement de la TVA), comptabilisez-la dans un compte distinct et non comme une dépense.
